<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f7f5" />
    <meta
      name="description"
      content="浏览、预览并下载 TongCraft 玩家分享的 Litematica 投影。"
    />
    <title>TongCraft 投影素材库 · 测试中</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div class="wrap">
      <header class="site-header">
        <div>
          <h1>TongCraft 投影素材库 <span class="beta">测试中</span></h1>
          <p>浏览、预览和下载玩家分享的 .litematic 投影。</p>
          <nav aria-label="相关站点">
            <a href="https://tongcraft.github.io/TongCraft-cdn/">玩家头像</a>
            <a href="https://github.com/TongCraft/tongcraft-sync">共享模组</a>
            <a href="https://github.com/TongCraft/tongcraft-schematics"
              >GitHub</a
            >
          </nav>
        </div>
        <div class="header-actions">
          <button id="localPreviewButton" class="button" type="button">
            本地预览
          </button>
          <input
            id="localPreviewInput"
            type="file"
            accept=".litematic"
            hidden
          />
          <span id="memberLabel" class="member-label" hidden></span>
          <button id="loginButton" class="button" type="button">
            玩家登录
          </button>
          <button
            id="uploadButton"
            class="button button-primary"
            type="button"
            hidden
          >
            上传投影
          </button>
        </div>
      </header>

      <main id="catalog">
        <div class="catalog-toolbar">
          <label class="search-control">
            搜索
            <input
              id="searchInput"
              type="search"
              placeholder="名称、介绍或作者"
              maxlength="80"
              autocomplete="off"
            />
          </label>
          <div class="filter-control">
            <span>分类</span>
            <div class="filters" role="group" aria-label="按标签筛选">
              <button class="filter active" type="button" data-tag="">
                全部
              </button>
              <button class="filter" type="button" data-tag="建筑">建筑</button>
              <button class="filter" type="button" data-tag="红石">红石</button>
              <button class="filter" type="button" data-tag="装饰">装饰</button>
              <button class="filter" type="button" data-tag="农场">农场</button>
            </div>
          </div>
          <span id="catalogCount" class="catalog-count">正在载入…</span>
        </div>
        <div id="catalogStatus" class="catalog-status" role="status"></div>
        <div id="itemGrid" class="item-grid" aria-live="polite"></div>
        <div class="pagination">
          <button id="prevPage" class="button" type="button" disabled>
            上一页
          </button>
          <span id="pageLabel">—</span>
          <button id="nextPage" class="button" type="button" disabled>
            下一页
          </button>
        </div>
      </main>

      <footer class="site-footer">
        <span>由 TongCraft 玩家共享 · 投影版权归原作者</span>
        <a href="https://github.com/TongCraft/tongcraft-schematics/issues"
          >反馈问题</a
        >
      </footer>
    </div>

    <dialog id="loginDialog" class="modal">
      <div class="modal-head">
        <h2>玩家登录</h2>
        <button class="icon-button" type="button" data-close aria-label="关闭">
          ×
        </button>
      </div>
      <p>
        在游戏中登录 TongCraft Sync，按 <kbd>H</kbd> → <strong>素材库</strong> →
        <strong>复制网页上传链接</strong>，然后在浏览器打开链接。
      </p>
      <p class="subtle">仅受邀成员可上传。链接仅能使用一次，五分钟后过期。</p>
      <button class="button button-primary full" type="button" data-close>
        知道了
      </button>
    </dialog>

    <dialog id="uploadDialog" class="modal modal-wide">
      <div class="modal-head">
        <h2>上传投影</h2>
        <button class="icon-button" type="button" data-close aria-label="关闭">
          ×
        </button>
      </div>
      <p class="subtle">上传后立即公开。请只分享你有权发布的作品。</p>
      <form id="uploadForm">
        <label
          >投影文件 <span>必填</span>
          <input
            id="fileInput"
            name="file"
            type="file"
            accept=".litematic"
            required
          />
          <small
            >仅支持 .litematic，最大 16 MiB。预览和材料清单会自动生成。</small
          >
        </label>
        <label
          >名称 <span>必填</span>
          <input
            name="title"
            maxlength="80"
            placeholder="例如：山间图书馆"
            required
          />
        </label>
        <label
          >简介 <span>选填</span>
          <textarea
            name="description"
            maxlength="1200"
            rows="3"
            placeholder="结构、用途或建造提示"
          ></textarea>
        </label>
        <label
          >标签 <span>选填</span>
          <input name="tags" maxlength="200" placeholder="建筑, 生存" />
          <small>用逗号分隔，最多 5 个。</small>
        </label>
        <div id="uploadStatus" class="form-status" role="status"></div>
        <button
          id="submitUpload"
          class="button button-primary full"
          type="submit"
        >
          发布投影
        </button>
      </form>
    </dialog>

    <dialog id="detailDialog" class="modal modal-detail">
      <div class="modal-head">
        <h2>投影详情</h2>
        <button class="icon-button" type="button" data-close aria-label="关闭">
          ×
        </button>
      </div>
      <div id="detailContent"></div>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
