name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check library
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:e2e
      - name: Check generated deployment configuration
        run: node scripts/prepare-deploy.mjs && npx wrangler deploy --dry-run --config .wrangler/deploy.json
        env:
          CLOUDFLARE_ACCOUNT_ID: "00000000000000000000000000000000"
          D1_DATABASE_ID: "00000000-0000-0000-0000-000000000001"
          SYNC_API_URL: https://sync.example.com
      - run: npm audit --audit-level=high

  deploy:
    name: Deploy Cloudflare Worker
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: tongcraft-library-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prepare deployment configuration
        run: node scripts/prepare-deploy.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          SYNC_API_URL: ${{ vars.SYNC_API_URL }}
          ALLOW_PUBLIC_PREVIEW: ${{ vars.ALLOW_PUBLIC_PREVIEW }}
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply tongcraft-schematics --remote --config .wrangler/deploy.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker, site, and custom domain
        run: npx wrangler deploy --config .wrangler/deploy.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
